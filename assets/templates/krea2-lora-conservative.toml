# Next Trainer candidate template (staging; not migrated). Krea 2 LoRA (Musubi engine page).
# Field values mirror the shipped project preset; wording discipline C-013 applies (see evidence card).
template_version = "2026-08-30"
scope = "krea2-lora-conservative"
base_model = "krea2"
model_train_type = "krea2-lora"

# --- network (shipped preset) ---
network_dim = 32
network_alpha = 32

# --- dataset class (page schema defaults) ---
resolution = "1024,1024"
enable_bucket = true
train_batch_size = 1
gradient_checkpointing = true

# --- optimizer / schedule (shipped preset) ---
optimizer_type = "AdamW8bit"
learning_rate = "1e-4"
lr_scheduler = "constant"

# --- precision (page pins bf16-only; fp8 pair must stay together or training will not run) ---
mixed_precision = "bf16"
fp8_base = true
fp8_scaled = true

# --- horizon & saving (shipped preset) ---
max_train_epochs = 16
save_every_n_epochs = 2
save_precision = "bf16"

# --- flow-matching objective (shipped preset) ---
timestep_sampling = "sigmoid"
sigmoid_scale = 1.0
discrete_flow_shift = 1.0

# --- in-training evaluation (page default preview shape) ---
enable_preview = true
sample_width = 1024
sample_height = 1024
sample_cfg = 4.5
sample_steps = 28
sample_seed = 42
sample_every_n_epochs = 2

# --- requires the Musubi runtime + preflight pass; LoRA-only page (no other adapters) ---
# asset fields (dit/vae/text_encoder) intentionally absent: fill real paths at import time
